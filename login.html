<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body4>
    <nav class="nav1">
    <a href="index.html" class="logo">Spotify</a>
    <ul class="nav-links1">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse.html">Browse</a></li>
      <li><a href="playlist.html">Playlist</a></li>
    </ul>
    <a href="login.html" class="nav-login1">Log in</a>
  </nav>

  <main class="login-page1">
    <section class="login-card1">
      <h1>Log in to Spotify</h1>

      <button class="social-btn" type="button">Continue with Google</button>
      <button class="social-btn" type="button">Continue with Facebook</button>

      <div class="divider"></div>

      <form action="index.html">
        <div class="field">
          <label for="email">Email or username</label>
          <input type="text" id="email" placeholder="Email or username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password">
        </div>
        <label class="remember">
          <input type="checkbox"> Remember me
        </label>
        <button type="submit" class="login-btn1">Log in</button>
      </form>

      <div class="login-links1">
        <p><a href="#">Forgot your password?</a></p>
        <p>Don't have an account? <a href="#">Sign up for Spotify</a></p>
      </div>
    </section>
  </main>
</body4>
</html>
